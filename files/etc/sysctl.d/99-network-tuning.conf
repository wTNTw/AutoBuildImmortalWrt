# 性能与网络协议栈优化配置 (针对 NanoPi R5C 等多核 2.5G 软路由)
# 注意：OpenWrt 的 /etc/init.d/sysctl 逐行执行，此处统一使用 key=value 紧凑写法
#
# 【重要】本文件里不得出现当前内核不支持的键，例如 net.core.default_qdisc=fq：
# R5C 的内核未编译 sch_fq，写该键会报 "write error: No such file or directory"。
# 虽然 busybox sysctl -e 会继续执行后续行，但为了确定性，这里只保留一定能生效的项，
# 且由 boot-tuning.sh 在开机后期再校对一次关键项（见 99-custom.sh）。

# 1. 拥塞控制（队列调度沿用内核默认 fq_codel，不强制 fq）
net.ipv4.tcp_congestion_control=bbr

# 2. 连接跟踪表与连接复用调优
net.netfilter.nf_conntrack_max=131072
net.netfilter.nf_conntrack_tcp_timeout_established=7200
net.ipv4.tcp_tw_reuse=1
net.ipv4.tcp_fin_timeout=25

# 3. 增强套接字与网络收发缓冲区 (支撑 2.5G 线速吞吐)
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.core.rmem_default=262144
net.core.wmem_default=262144
net.core.netdev_max_backlog=16384
net.core.somaxconn=8192
net.core.optmem_max=65536
net.ipv4.tcp_rmem=4096 87380 16777216
net.ipv4.tcp_wmem=4096 65536 16777216

# 4. TCP 快速打开与系统资源上限
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_slow_start_after_idle=0
fs.file-max=2097152

# 5. 内存与交换策略 (优先使用物理内存，降低换出倾向)
vm.swappiness=10
vm.vfs_cache_pressure=50
